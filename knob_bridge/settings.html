<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knob notifications</title>
<style>
:root{font-family:"Noto Sans",Cantarell,sans-serif;color:#202d42;background:#eef3fa;color-scheme:light;--blue:#245cb8;--line:#cfdae9;--muted:#52647e}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:46px auto;padding:0 24px 40px}header{display:flex;align-items:center;gap:18px;margin-bottom:28px}.knob{flex-shrink:0;width:62px;height:62px;border:7px solid #4269a0;border-radius:50%;box-shadow:inset 0 0 0 3px #eef3fa;background:#b9d3f4;position:relative}.knob:after{content:"";position:absolute;left:22px;top:3px;height:15px;width:3px;background:#245cb8;border-radius:3px}h1{font-size:27px;font-weight:650;letter-spacing:-.5px;margin:0 0 5px}p{line-height:1.55;margin:0;color:var(--muted);font-size:14px}section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 22px;margin:18px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:19px 0}.row+.row{border-top:1px solid #e4eaf3}.label{display:block;font-size:15px;font-weight:600}.hint{display:block;color:var(--muted);font-size:13px;margin-top:5px;line-height:1.5}input[type=checkbox]{appearance:none;flex-shrink:0;width:42px;height:25px;border-radius:20px;background:#a4b1c5;position:relative;cursor:pointer;margin:0}input[type=checkbox]:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff}input[type=checkbox]:checked{background:var(--blue)}input[type=checkbox]:checked:after{left:20px}input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #8fb8f1;outline-offset:3px}select,input[type=search],input[type=text],input[type=number]{border:1px solid #a9b9d0;border-radius:7px;color:inherit;background:white;padding:9px;font:inherit;font-size:14px}select{max-width:310px}input[type=number]{width:110px}h2{font-size:19px;margin:28px 0 8px}.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:16px 0}.tools input{width:100%}.tools button{white-space:nowrap}button{background:#e7effc;color:#184885;border:1px solid #b2c9ec;border-radius:7px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}button:hover{background:#d5e4fb}.app{font-weight:500;overflow-wrap:anywhere}.empty{padding:22px 0}.status{font-size:13px;min-height:24px;color:#236148;margin:10px 0}.error{color:#a12836}.footer{margin-top:22px;font-size:13px}.app-entry[hidden]{display:none}#apps{max-height:460px;overflow:auto}#add{display:flex;gap:10px;margin-bottom:18px}#add input{min-width:0;flex:1}@media(max-width:560px){main{margin-top:25px;padding:0 16px}h1{font-size:23px}section{padding:0 16px}.row{gap:12px}select{max-width:155px}.knob{width:50px;height:50px;border-width:6px}.knob:after{left:17px;top:2px}header{gap:12px}}
</style>
<main><header><div class="knob" aria-hidden="true"></div><div><h1>Knob notifications</h1><p>Choose what follows your phone to the knob.</p></div></header>
<section aria-label="Sharing preferences">
<label class="row"><span><span class="label">Share notifications</span><span class="hint">Pause sharing without changing your app choices.</span></span><input id="enabled" type="checkbox" aria-label="Share notifications"></label>
<label class="row"><span><span class="label">When your phone clears it</span><span class="hint">The matching knob popup clears too. Reading a message works when its app removes the phone notification.</span></span><span aria-label="Enabled">Synced</span></label>
<label class="row"><span><span class="label">Timeout in seconds</span><span class="hint">Clear when your phone does or after this many seconds, whichever comes first. Use 0 for no timeout. Default: 30; maximum: 3600. Pressing the knob always dismisses it.</span></span><input id="timeout_seconds" type="number" min="0" max="3600" step="1" required aria-label="Timeout in seconds"></label>
<label class="row"><span><span class="label">Share silent notifications</span><span class="hint">Include notifications your phone marks as silent.</span></span><input id="silent" type="checkbox" aria-label="Share silent notifications"></label>
<label class="row"><span><span class="label">New apps</span><span class="hint">Choose what happens before you set an app's switch.</span></span><select id="default_share"><option value="true">Share by default</option><option value="false">Only apps I choose</option></select></label>
</section>
<h2>Apps</h2><p>Apps appear as KDE Connect receives their notifications. Your choices affect only the knob.</p>
<div class="tools"><input id="search" type="search" placeholder="Find an app" aria-label="Find an app"><button id="refresh" type="button">Refresh apps</button></div>
<section id="apps" aria-label="App sharing"></section>
<form id="add"><input id="app-name" maxlength="128" placeholder="Or enter an exact app name" aria-label="Exact app name"><button>Add app</button></form>
<div id="status" class="status" role="status" aria-live="polite"></div>
<p class="footer">Changes save automatically on this desktop. Notification messages and pictures are not shown or stored here.</p>
</main>
<script>
const token='__TOKEN__';let state=null,busy=false;
const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Bridge-Token':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});let data;try{data=await r.json()}catch{throw Error('The bridge did not respond. Refresh this page.')}if(!r.ok)throw Error(data.error||'Could not save your changes.');return data}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function render(){if(!state)return;$('enabled').checked=state.enabled;$('silent').checked=!state.ignore_silent;$('default_share').value=String(state.default_share);$('timeout_seconds').value=state.timeout_seconds;const host=$('apps');host.replaceChildren();const names=[...new Set([...state.known_apps,...Object.keys(state.apps)])].sort((a,b)=>a.localeCompare(b));for(const name of names){const row=document.createElement('label');row.className='row app-entry';row.dataset.name=name.toLocaleLowerCase();const text=document.createElement('span');text.className='app';text.textContent=name;const toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=state.apps[name]??state.default_share;toggle.setAttribute('aria-label','Share '+name);toggle.onchange=()=>save({apps:{...state.apps,[name]:toggle.checked}});row.append(text,toggle);host.append(row)}if(!names.length){const p=document.createElement('p');p.className='empty';p.textContent='No apps discovered yet. Send a phone notification or add an app by name.';host.append(p)}filter()}
function filter(){const q=$('search').value.toLocaleLowerCase();document.querySelectorAll('.app-entry').forEach(e=>e.hidden=!e.dataset.name.includes(q))}
async function save(changes){if(busy){render();return}busy=true;status('Saving…');document.querySelectorAll('input[type=checkbox],input[type=number],select,button').forEach(e=>e.disabled=true);try{state=await api('/api/preferences',changes);render();status('Saved. New notifications use these choices.')}catch(e){render();status(e.message,true)}finally{busy=false;document.querySelectorAll('input[type=checkbox],input[type=number],select,button').forEach(e=>e.disabled=false)}}
async function refresh(){try{state=await api('/api/state');render()}catch(e){status(e.message,true)}}
$('enabled').onchange=()=>save({enabled:$('enabled').checked});$('silent').onchange=()=>save({ignore_silent:!$('silent').checked});$('default_share').onchange=()=>save({default_share:$('default_share').value==='true'});$('timeout_seconds').onchange=()=>{if($('timeout_seconds').reportValidity())save({timeout_seconds:Number($('timeout_seconds').value)})};$('search').oninput=filter;$('refresh').onclick=refresh;$('add').onsubmit=e=>{e.preventDefault();const name=$('app-name').value.trim();if(name){save({apps:{...state.apps,[name]:true}});$('app-name').value=''}};refresh();
</script></html>
