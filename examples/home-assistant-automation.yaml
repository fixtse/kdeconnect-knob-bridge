alias: KDE Connect notifications on knob
description: Forward fresh desktop notifications; never replay retained MQTT messages.
triggers:
  - trigger: mqtt
    topic: desktop/knob/notification
conditions:
  - condition: template
    value_template: >-
      {{ trigger.payload_json is mapping
         and trigger.payload_json.get('kind') == 'notification'
         and 0 <= as_timestamp(now()) - (trigger.payload_json.get('timestamp', 0) | int(0)) < 30
         and trigger.payload_json.get('message', '') | length > 0 }}
actions:
  - action: esphome.onx2424g013_dbbc54_show_message
    data:
      title: "{{ trigger.payload_json.title }}"
      message: "{{ trigger.payload_json.message }}"
      image_url: "{{ trigger.payload_json.get('image_url', '') }}"
      timeout_seconds: "{{ trigger.payload_json.get('timeout_seconds', 30) | int(30) }}"
mode: restart
